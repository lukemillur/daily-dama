<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#f5f1eb; font-family:Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f1eb; padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; padding:32px;">
            <tr>
              <td style="text-align:center; padding-bottom:16px;">
                <span style="font-size:22px; font-weight:700; color:#1f1a17;">Daily Dama</span>
              </td>
            </tr>
            <tr>
              <td style="text-align:center; padding-bottom:24px; color:#3a332e; font-size:15px; line-height:1.5;">
                Reset your Daily Dama password.
              </td>
            </tr>
            <tr>
              <td style="text-align:center; padding-bottom:24px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block; background-color:#1f1a17; color:#ffffff; text-decoration:none; font-weight:600; font-size:15px; padding:12px 24px; border-radius:8px;"
                >
                  Reset your password
                </a>
              </td>
            </tr>
            <tr>
              <td style="text-align:center; color:#8a8078; font-size:12px; line-height:1.5;">
                If you didn't request a password reset, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
