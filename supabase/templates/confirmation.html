<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#f8f1dd; font-family:Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f1dd; padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#fffaf0; border:2px solid #18382e; border-radius:6px; box-shadow:8px 8px 0 #18382e; padding:32px;">
            <tr>
              <td style="text-align:center; padding-bottom:20px;">
                <span style="font-size:22px; font-weight:900; letter-spacing:-0.6px; color:#18382e;">Daily Dama</span>
              </td>
            </tr>
            <tr>
              <td style="text-align:center; padding-bottom:20px;">
                <span style="display:inline-block; background-color:#d84929; color:#fffaf0; font-size:12px; font-weight:900; letter-spacing:1.6px; text-transform:uppercase; padding:6px 14px; border-radius:999px;">
                  Confirm your email
                </span>
              </td>
            </tr>
            <tr>
              <td style="text-align:center; padding-bottom:28px; color:#274137; font-size:15px; line-height:1.5;">
                Confirm your email to start tracking your Kendama practice.
              </td>
            </tr>
            <tr>
              <td style="text-align:center; padding-bottom:28px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block; background-color:#18382e; color:#f4c94d; text-decoration:none; font-weight:900; font-size:15px; letter-spacing:0.4px; text-transform:uppercase; padding:14px 28px; border:2px solid #18382e; border-radius:4px;"
                >
                  Confirm your account
                </a>
              </td>
            </tr>
            <tr>
              <td style="text-align:center; color:#71807a; font-size:12px; line-height:1.5;">
                If you didn't create a Daily Dama account, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
