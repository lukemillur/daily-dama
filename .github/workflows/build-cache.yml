name: Build cache

# Populates the Jest and Metro transform caches that ci.yml's verify job
# restores. It runs on development pushes because PR runs can restore caches
# saved on their base branch but not caches saved by sibling PR branches.
# Running the test suite and web export here also flags a post-merge break on
# development, but it is not a merge gate.
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Restore build caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/jest-cache
            /tmp/metro-cache
          key: app-build-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            app-build-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Test
        run: yarn test --ci --cacheDirectory /tmp/jest-cache

      - name: Export web
        run: yarn expo export --platform web --output-dir /tmp/daily-dama-web-export

      # Neither cache evicts old entries itself. Each save carries forward the
      # restored contents, so drop entries that have gone two weeks without
      # being rewritten to keep the archive from growing without bound.
      - name: Prune stale cache entries
        if: ${{ !cancelled() }}
        run: find /tmp/jest-cache /tmp/metro-cache -type f -mtime +14 -delete 2>/dev/null || true

      - name: Save build caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/jest-cache
            /tmp/metro-cache
          key: app-build-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
